<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="920" viewBox="0 0 1100 920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Where AAuth runs</title>
<defs><marker id="ar" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="1.5" y="1.5" width="1097" height="917" rx="16" ry="16" fill="#ffffff" stroke="#d1d5db" stroke-width="3"/>
<text x="550.0" y="42" font-size="26" font-weight="bold" text-anchor="middle" fill="#111827">Where AAuth runs</text>
<text x="550.0" y="70" font-size="17" font-weight="normal" text-anchor="middle" fill="#4b5563">Agents and approvers reach DreamFactory only at the issuer, https://api.example.com</text>
<rect x="410" y="90" width="230" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="525.0" y="116" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">Person's browser</text>
<text x="525.0" y="139" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">(approver)</text>
<line x1="525.0" y1="150" x2="525.0" y2="187" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="515.0" y="176" font-size="16" font-weight="normal" text-anchor="end" fill="#111827">consent pages (https)</text>
<rect x="800" y="90" width="240" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="920" y="116" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">Admin's browser</text>
<text x="920" y="139" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">admin app</text>
<line x1="920" y1="150" x2="920" y2="187" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="910" y="176" font-size="16" font-weight="normal" text-anchor="end" fill="#111827">admin app (can stay internal)</text>
<rect x="20" y="190" width="280" height="440" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="9,6"/>
<text x="160" y="216" font-size="18" font-weight="bold" text-anchor="middle" fill="#374151">Your agent side</text>
<rect x="40" y="232" width="240" height="132" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="160" y="262" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">Agent</text>
<text x="160" y="288" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">aauth CLI, Node, Python</text>
<text x="160" y="314" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">or your own code</text>
<text x="160" y="340" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151" font-style="italic">holds its request key</text>
<rect x="40" y="470" width="240" height="140" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="160" y="498" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">Agent provider</text>
<text x="160" y="522" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">agents.example.com</text>
<text x="160" y="546" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">/.well-known/</text>
<text x="160" y="570" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">aauth-agent.json</text>
<text x="160" y="594" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">/jwks.json</text>
<rect x="410" y="190" width="230" height="290" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="525.0" y="218" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">TLS reverse proxy</text>
<text x="525.0" y="242" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">api.example.com:443</text>
<text x="525.0" y="280" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">keeps Host, path,</text>
<text x="525.0" y="310" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">query, signature</text>
<text x="525.0" y="340" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">headers and body;</text>
<text x="525.0" y="370" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">passes /.well-known/</text>
<text x="525.0" y="400" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">aauth-* and /aauth/*;</text>
<text x="525.0" y="430" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">sends X-Forwarded-For</text>
<rect x="760" y="190" width="320" height="440" rx="8" fill="#e0ecff" stroke="#374151" stroke-width="2"/>
<text x="920.0" y="218" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">DreamFactory (http)</text>
<rect x="774" y="234" width="292" height="102" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<text x="920.0" y="258" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827">Resource</text>
<text x="920.0" y="282" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">/api/v2, /aauth/authorize</text>
<text x="920.0" y="304" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">/.well-known/</text>
<text x="920.0" y="326" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">aauth-resource.json</text>
<rect x="774" y="360" width="292" height="124" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<text x="920.0" y="384" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827">Person server</text>
<text x="920.0" y="408" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">/aauth/person, /aauth/token</text>
<text x="920.0" y="430" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">/aauth/pending/{id}</text>
<text x="920.0" y="452" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">consent pages: /aauth/interact</text>
<text x="920.0" y="474" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">and /aauth/grants</text>
<rect x="774" y="508" width="292" height="58" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<text x="920.0" y="532" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827">Agent provider for Try it</text>
<text x="920.0" y="556" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">/.well-known/aauth-agent.json</text>
<text x="920.0" y="612" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">JWKS: /aauth/jwks/*.json</text>
<line x1="835" y1="630" x2="835" y2="668" stroke="#374151" stroke-width="2"/>
<line x1="1005" y1="630" x2="1005" y2="668" stroke="#374151" stroke-width="2"/>
<path d="M760,680 L760,786 A75.0,12 0 0 0 910,786 L910,680" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<ellipse cx="835.0" cy="680" rx="75.0" ry="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="835.0" y="712" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827">System</text>
<text x="835.0" y="734" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827">database</text>
<text x="835.0" y="756" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">aauth_* tables</text>
<path d="M930,680 L930,786 A75.0,12 0 0 0 1080,786 L1080,680" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<ellipse cx="1005.0" cy="680" rx="75.0" ry="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="1005.0" y="712" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827">Cache</text>
<text x="1005.0" y="734" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">short-lived</text>
<text x="1005.0" y="756" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">state, shared</text>
<text x="1005.0" y="778" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">across nodes</text>
<rect x="410" y="668" width="230" height="118" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2" stroke-dasharray="9,6"/>
<text x="525.0" y="694" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827">External</text>
<text x="525.0" y="717" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827">person server</text>
<text x="525.0" y="740" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">https://ps.example.com</text>
<text x="525.0" y="763" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151" font-style="italic">(optional)</text>
<line x1="280" y1="286" x2="407" y2="286" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="355" y="258" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">signed</text>
<text x="355" y="278" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">requests</text>
<line x1="640" y1="286" x2="757" y2="286" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="700.0" y="258" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">Host and</text>
<text x="700.0" y="278" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">path kept</text>
<line x1="760" y1="400" x2="643" y2="400" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="700.0" y="424" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">Try it calls</text>
<text x="700.0" y="444" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">the issuer</text>
<text x="700.0" y="464" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">from the</text>
<text x="700.0" y="484" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">server</text>
<line x1="760" y1="560" x2="283" y2="560" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="530" y="516" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">https discovery: public</text>
<text x="530" y="538" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">addresses only, unless admitted</text>
<path d="M760,612 L525.0,612 L525.0,665" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="700.0" y="603" font-size="16" font-weight="normal" text-anchor="middle" fill="#111827">discovery</text>
<text x="550.0" y="846" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">DreamFactory accepts a signed request only when the host the agent signed is the issuer host,</text>
<text x="550.0" y="872" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">so every agent request, and every consent page, must reach it at https://api.example.com.</text>
</svg>
