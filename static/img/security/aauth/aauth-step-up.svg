<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1150" viewBox="0 0 1100 1150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Step-up: asking for a second scope</title>
<defs><marker id="ar" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="1.5" y="1.5" width="1097" height="1147" rx="16" ry="16" fill="#ffffff" stroke="#d1d5db" stroke-width="3"/>
<text x="550.0" y="44" font-size="26" font-weight="bold" text-anchor="middle" fill="#111827">Step-up: asking for a second scope</text>
<path d="M495,90 L495,80 L930,80 L930,90" fill="none" stroke="#6b7280" stroke-width="2"/>
<text x="712.5" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#374151">Issuer https://api.example.com</text>
<rect x="75.0" y="98" width="310" height="78" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="230" y="132" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">Agent</text>
<text x="230" y="154" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">aauth:reports@agents.example.com</text>
<rect x="495.0" y="98" width="210" height="78" rx="8" fill="#e0ecff" stroke="#374151" stroke-width="2"/>
<text x="600" y="132" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">DreamFactory API</text>
<text x="600" y="154" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">/api/v2 (resource)</text>
<rect x="730.0" y="98" width="200" height="78" rx="8" fill="#e0ecff" stroke="#374151" stroke-width="2"/>
<text x="830" y="122" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">DreamFactory</text>
<text x="830" y="143" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">person server</text>
<text x="830" y="164" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">/aauth</text>
<rect x="935.0" y="98" width="150" height="78" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="1010" y="132" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">Person</text>
<text x="1010" y="154" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">in a browser</text>
<line x1="230" y1="176" x2="230" y2="990" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7,6"/>
<line x1="600" y1="176" x2="600" y2="990" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7,6"/>
<line x1="830" y1="176" x2="830" y2="990" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7,6"/>
<line x1="1010" y1="176" x2="1010" y2="990" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7,6"/>
<rect x="80" y="192" width="300" height="60" rx="6" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
<text x="230.0" y="219" font-size="17" font-weight="normal" text-anchor="middle" fill="#7c2d12">holds an auth token for</text>
<text x="230.0" y="241" font-size="17" font-weight="normal" text-anchor="middle" fill="#7c2d12">scope sales.read</text>
<line x1="230" y1="318" x2="597" y2="318" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="415.0" y="287" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">a. PATCH .../_table/orders/5</text>
<text x="415.0" y="309" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">(auth token: sales.read)</text>
<line x1="600" y1="408" x2="233" y2="408" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="415.0" y="355" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">401 insufficient_scope,</text>
<text x="415.0" y="377" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">requirement=auth-token,</text>
<text x="415.0" y="399" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">resource token (sales.read sales.refund)</text>
<line x1="230" y1="480" x2="827" y2="480" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="415.0" y="449" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">b. POST /aauth/token, presented</text>
<text x="415.0" y="471" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">token = current auth token</text>
<line x1="830" y1="530" x2="233" y2="530" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="415.0" y="521" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">202, code M4XD-8PQT</text>
<line x1="230" y1="602" x2="1007" y2="602" stroke="#1f2937" stroke-width="3.5" stroke-dasharray="1,8" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="415.0" y="571" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">c. link and code (an open</text>
<text x="415.0" y="593" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">consent page moves on by itself)</text>
<line x1="1010" y1="674" x2="833" y2="674" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="920.0" y="643" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">d. Consent card:</text>
<text x="920.0" y="665" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">Allow both scopes</text>
<rect x="645" y="690" width="440" height="82" rx="6" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
<text x="865.0" y="717" font-size="16" font-weight="normal" text-anchor="middle" fill="#7c2d12">Jordan Lee holds both roles: can allow.</text>
<text x="865.0" y="739" font-size="16" font-weight="normal" text-anchor="middle" fill="#7c2d12">Sam Patel lacks Sales refunds:</text>
<text x="865.0" y="761" font-size="16" font-weight="normal" text-anchor="middle" fill="#7c2d12">sales.refund locked, Allow disabled.</text>
<line x1="830" y1="860" x2="233" y2="860" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="415.0" y="829" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">e. 200 auth token after polling</text>
<text x="415.0" y="851" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">(sales.read sales.refund)</text>
<line x1="230" y1="920" x2="597" y2="920" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="415.0" y="911" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">f. PATCH again, signed afresh</text>
<line x1="600" y1="978" x2="233" y2="978" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="415.0" y="969" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">200 AAuth-Scope: sales.refund</text>
<rect x="30" y="1010" width="1040" height="124" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="550.0" y="1040" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">DreamFactory asks for the least privileged enabled scope that allows the request:</text>
<text x="550.0" y="1064" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">fewest access rows, then fewest verbs, then lowest role id.</text>
<text x="550.0" y="1094" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">The new auth token expires when the old one would have.</text>
<text x="550.0" y="1120" font-size="16" font-weight="normal" text-anchor="middle" fill="#4b5563">Solid: request. Dashed: response. Dotted: the agent shows the person a link.</text>
</svg>
