<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1270" viewBox="0 0 1100 1270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>AAuth in DreamFactory: an agent gets a person's approval</title>
<defs><marker id="ar" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="1.5" y="1.5" width="1097" height="1267" rx="16" ry="16" fill="#ffffff" stroke="#d1d5db" stroke-width="3"/>
<text x="550.0" y="44" font-size="26" font-weight="bold" text-anchor="middle" fill="#111827">AAuth in DreamFactory: an agent gets a person's approval</text>
<path d="M495,90 L495,80 L930,80 L930,90" fill="none" stroke="#6b7280" stroke-width="2"/>
<text x="712.5" y="72" font-size="17" font-weight="bold" text-anchor="middle" fill="#374151">Issuer https://api.example.com</text>
<rect x="75.0" y="98" width="310" height="78" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="230" y="132" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">Agent</text>
<text x="230" y="154" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">aauth:reports@agents.example.com</text>
<rect x="495.0" y="98" width="210" height="78" rx="8" fill="#e0ecff" stroke="#374151" stroke-width="2"/>
<text x="600" y="132" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">DreamFactory API</text>
<text x="600" y="154" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">/api/v2 (resource)</text>
<rect x="730.0" y="98" width="200" height="78" rx="8" fill="#e0ecff" stroke="#374151" stroke-width="2"/>
<text x="830" y="122" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">DreamFactory</text>
<text x="830" y="143" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">person server</text>
<text x="830" y="164" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">/aauth</text>
<rect x="935.0" y="98" width="150" height="78" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="1010" y="122" font-size="19" font-weight="bold" text-anchor="middle" fill="#111827">Person</text>
<text x="1010" y="143" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">Jordan Lee,</text>
<text x="1010" y="164" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">in a browser</text>
<line x1="230" y1="176" x2="230" y2="1110" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7,6"/>
<line x1="600" y1="176" x2="600" y2="1110" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7,6"/>
<line x1="830" y1="176" x2="830" y2="1110" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7,6"/>
<line x1="1010" y1="176" x2="1010" y2="1110" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7,6"/>
<line x1="230" y1="238" x2="597" y2="238" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="415.0" y="207" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">1. GET /api/v2/sales/_table/orders</text>
<text x="415.0" y="229" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">(signed, agent token)</text>
<rect x="14" y="256" width="196" height="112" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="112.0" y="282" font-size="18" font-weight="bold" text-anchor="middle" fill="#111827">Agent provider</text>
<text x="112.0" y="304" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">agents.example.com</text>
<text x="112.0" y="326" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">aauth-agent.json,</text>
<text x="112.0" y="348" font-size="16" font-weight="normal" text-anchor="middle" fill="#374151">jwks.json</text>
<line x1="600" y1="330.0" x2="213" y2="330.0" stroke="#1f2937" stroke-width="3.5" stroke-dasharray="1,8" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="415.0" y="299.0" font-size="17" font-weight="normal" text-anchor="middle" fill="#374151">fetch metadata and keys</text>
<text x="415.0" y="321.0" font-size="17" font-weight="normal" text-anchor="middle" fill="#374151">to verify the agent token</text>
<line x1="600" y1="432" x2="233" y2="432" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="415.0" y="401" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">401 AAuth-Requirement:</text>
<text x="415.0" y="423" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">requirement=person-token</text>
<line x1="230" y1="490" x2="827" y2="490" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="415.0" y="481" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">2. POST /aauth/person</text>
<line x1="830" y1="540" x2="233" y2="540" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="415.0" y="531" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">202, code 7KQM-4D2P</text>
<line x1="230" y1="590" x2="1007" y2="590" stroke="#1f2937" stroke-width="3.5" stroke-dasharray="1,8" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="415.0" y="581" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">3. link and code</text>
<line x1="1010" y1="662" x2="833" y2="662" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="920.0" y="631" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">Sign in, Continue</text>
<text x="920.0" y="653" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">as Jordan</text>
<line x1="230" y1="712" x2="827" y2="712" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="415.0" y="703" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">4. Poll /aauth/pending/...</text>
<line x1="830" y1="762" x2="233" y2="762" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="415.0" y="753" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">200 person token</text>
<line x1="230" y1="812" x2="597" y2="812" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="415.0" y="803" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">5. GET ... (person token)</text>
<line x1="600" y1="884" x2="233" y2="884" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="415.0" y="853" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">401 requirement=auth-token;</text>
<text x="415.0" y="875" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">resource token (sales.read)</text>
<line x1="230" y1="934" x2="827" y2="934" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="415.0" y="925" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">6. POST /aauth/token</text>
<line x1="1010" y1="960" x2="833" y2="960" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="920.0" y="951" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">Allow sales.read</text>
<line x1="830" y1="1010" x2="233" y2="1010" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="415.0" y="1001" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">200 auth token (after polling)</text>
<line x1="230" y1="1060" x2="597" y2="1060" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="415.0" y="1051" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">7. GET ... (auth token)</text>
<line x1="600" y1="1110" x2="233" y2="1110" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="10,7" marker-end="url(#ar)"/>
<text x="415.0" y="1101" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">200 AAuth-Scope: sales.read</text>
<rect x="385" y="1122" width="430" height="38" rx="6" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
<text x="600.0" y="1149" font-size="17" font-weight="normal" text-anchor="middle" fill="#7c2d12">Runs as role Sales read for Jordan Lee</text>
<rect x="30" y="1182" width="1040" height="74" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="550.0" y="1210" font-size="17" font-weight="normal" text-anchor="middle" fill="#111827">Every request is signed with the agent's key (RFC 9421); tokens are bound to that key.</text>
<text x="550.0" y="1238" font-size="16" font-weight="normal" text-anchor="middle" fill="#4b5563">Solid: request. Dashed: response. Dotted: the agent shows the person a link, or a discovery fetch.</text>
</svg>
