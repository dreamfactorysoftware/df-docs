<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f2937"/></marker></defs>
<rect width="1400" height="1200" fill="#ffffff"/>
<text x="700.0" y="44" font-size="28" font-weight="bold" text-anchor="middle" fill="#111827">DreamFactory identity passthrough: per-user database identity</text>
<text x="700.0" y="76" font-size="17" text-anchor="middle" fill="#4b5563">The database service config uses placeholders: username = {db_user}, password = {db_pass}. Each user's values are stored as private (encrypted) lookups.</text>
<rect x="35" y="110" width="230" height="64" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="150" y="148" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">End user</text>
<line x1="150" y1="174" x2="150" y2="900" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="305" y="110" width="230" height="64" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="420" y="138" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Identity provider</text>
<text x="420" y="160" font-size="14" font-weight="normal" text-anchor="middle" fill="#111827">(SSO / OAuth)</text>
<line x1="420" y1="174" x2="420" y2="900" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="575" y="110" width="230" height="64" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="690" y="138" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">AI agent</text>
<text x="690" y="160" font-size="14" font-weight="normal" text-anchor="middle" fill="#111827">(MCP client / app)</text>
<line x1="690" y1="174" x2="690" y2="900" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="845" y="110" width="230" height="64" rx="8" fill="#e0ecff" stroke="#374151" stroke-width="1.5"/>
<text x="960" y="148" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">DreamFactory</text>
<line x1="960" y1="174" x2="960" y2="900" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="1125" y="110" width="230" height="64" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="1240" y="138" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Database</text>
<text x="1240" y="160" font-size="14" font-weight="normal" text-anchor="middle" fill="#111827">(any SQL connector)</text>
<line x1="1240" y1="174" x2="1240" y2="900" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,5"/>
<line x1="150" y1="230" x2="416" y2="230" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="285.0" y="220" font-size="15" text-anchor="middle" fill="#111827">1. Sign in with SSO</text>
<line x1="420" y1="296" x2="686" y2="296" stroke="#1f2937" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ar)"/>
<text x="555.0" y="286" font-size="15" text-anchor="middle" fill="#111827">2. Identity returned; DF session token issued to the agent</text>
<line x1="150" y1="362" x2="686" y2="362" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="420.0" y="352" font-size="15" text-anchor="middle" fill="#111827">3. "Show me my department's records"</text>
<line x1="690" y1="428" x2="956" y2="428" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="825.0" y="418" font-size="15" text-anchor="middle" fill="#111827">4. REST or MCP call carrying the USER's token</text>
<rect x="770" y="472" width="380" height="40" rx="6" fill="#fff7e6" stroke="#d97706"/>
<text x="960" y="498" font-size="14" text-anchor="middle" fill="#7c2d12">5. Validate token, load user's role + private lookups</text>
<rect x="730" y="538" width="460" height="40" rx="6" fill="#fff7e6" stroke="#d97706"/>
<text x="960" y="564" font-size="14" text-anchor="middle" fill="#7c2d12">6. Build connection: {db_user} -> alice_db, {db_pass} -> ****</text>
<line x1="960" y1="626" x2="1236" y2="626" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
<text x="1100.0" y="616" font-size="15" text-anchor="middle" fill="#111827">7. Connect AS alice_db, run query</text>
<rect x="830" y="670" width="545" height="40" rx="6" fill="#fff7e6" stroke="#d97706"/>
<text x="1102" y="696" font-size="14" text-anchor="middle" fill="#7c2d12">8. DB enforces alice_db grants / RLS; audit log user = alice_db</text>
<line x1="1240" y1="758" x2="964" y2="758" stroke="#1f2937" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ar)"/>
<text x="1100.0" y="748" font-size="15" text-anchor="middle" fill="#111827">9. Rows alice_db is allowed to see</text>
<line x1="960" y1="824" x2="694" y2="824" stroke="#1f2937" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ar)"/>
<text x="825.0" y="814" font-size="15" text-anchor="middle" fill="#111827">10. Response; DF log: user, role, tool, status</text>
<rect x="60" y="925" width="1280" height="245" rx="10" fill="#f9fafb" stroke="#6b7280"/>
<text x="85" y="961" font-size="20" font-weight="bold" fill="#111827">Service account vs per-user credentials</text>
<text x="85" y="997" font-size="15" font-weight="bold" fill="#111827"></text>
<text x="440" y="997" font-size="15" font-weight="bold" fill="#111827">Service account (default)</text>
<text x="880" y="997" font-size="15" font-weight="bold" fill="#111827">Per-user credentials (lookups)</text>
<text x="85" y="1031" font-size="15" font-weight="bold" fill="#111827">DB connection opened as</text>
<text x="440" y="1031" font-size="15" font-weight="normal" fill="#111827">Service account on the DF service</text>
<text x="880" y="1031" font-size="15" font-weight="normal" fill="#111827">Each user's own database account</text>
<text x="85" y="1065" font-size="15" font-weight="bold" fill="#111827">Who enforces access</text>
<text x="440" y="1065" font-size="15" font-weight="normal" fill="#111827">DF roles (tables, verbs, row filters)</text>
<text x="880" y="1065" font-size="15" font-weight="normal" fill="#111827">Database grants / RLS, plus DF roles on top</text>
<text x="85" y="1099" font-size="15" font-weight="bold" fill="#111827">Database audit log shows</text>
<text x="440" y="1099" font-size="15" font-weight="normal" fill="#111827">Service account</text>
<text x="880" y="1099" font-size="15" font-weight="normal" fill="#111827">The actual end user</text>
<text x="85" y="1133" font-size="15" font-weight="bold" fill="#111827">End user recorded in</text>
<text x="440" y="1133" font-size="15" font-weight="normal" fill="#111827">DF logs (MCP: user, role, tool, status)</text>
<text x="880" y="1133" font-size="15" font-weight="normal" fill="#111827">Database audit AND DF logs</text>
<text x="700.0" y="1188" font-size="13" text-anchor="middle" fill="#6b7280">The SSO token is not forwarded to the database. DreamFactory maps the authenticated user to that user's database credentials.</text>
</svg>